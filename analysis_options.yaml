# Linter rules for consistent Dart/Flutter code
# Using flutter_lints as a foundation with sensible customizations

include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"
    - ".dart_tool/**"
    - "packages/**"  # Exclude lint package from analysis
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Relaxed rules (disabled)
    prefer_final_locals: false
    prefer_final_fields: false
    lines_longer_than_80_chars: false
    always_put_required_named_parameters_first: false
    sort_constructors_first: false

    # Essential style rules
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_single_quotes: true
    require_trailing_commas: true
    avoid_print: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    sort_child_properties_last: true
    use_full_hex_values_for_flutter_colors: true
    use_super_parameters: true

    # Code quality
    await_only_futures: true
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true

    # Discourage global/top-level functions (prefer classes/extensions)
    avoid_classes_with_only_static_members: false  # Allow utility classes as alternative
    library_private_types_in_public_api: true

    # Unused code detection
    unreachable_from_main: true
    unnecessary_lambdas: true
    unnecessary_this: true

